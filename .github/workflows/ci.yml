name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos minimos: el workflow solo necesita leer el repositorio.
permissions:
  contents: read

# Cancela la ejecucion anterior de la misma rama cuando llega una nueva.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Misma major que docker-compose.yml para que las pruebas corran contra la
    # version real. La base termina en _test, como exige el harness.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cafeteria
          POSTGRES_PASSWORD: cafeteria
          POSTGRES_DB: cafeteria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafeteria -d cafeteria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Valores solo para CI: el secreto JWT es ficticio y nunca el real.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cafeteria:cafeteria@localhost:5432/cafeteria_test?schema=public
      JWT_SECRET: secreto-de-integracion-continua-con-mas-de-32-caracteres
      JWT_EXPIRES_IN: 8h

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Falla si el lockfile apunta a un registry distinto del oficial. Se
      # ejecuta antes de npm ci para no instalar desde un host inesperado.
      - name: Verificar registry del package-lock
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const malas = [];
          const visitar = (valor) => {
            if (!valor || typeof valor !== 'object') return;
            for (const [clave, hijo] of Object.entries(valor)) {
              if (clave === 'resolved' && typeof hijo === 'string') {
                let url;
                try {
                  url = new URL(hijo);
                } catch {
                  continue;
                }
                if (url.hostname !== 'registry.npmjs.org') malas.push(hijo);
              } else {
                visitar(hijo);
              }
            }
          };

          visitar(lock);
          if (malas.length > 0) {
            console.error('URLs resolved fuera de registry.npmjs.org:');
            for (const url of malas) console.error(`  ${url}`);
            process.exit(1);
          }
          console.log('Todas las URLs resolved usan registry.npmjs.org.');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # src/generated/ esta en .gitignore, asi que el cliente se genera en CI.
      # prisma.config.ts lee DATABASE_URL de process.env; la del job sirve.
      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Compilar
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      # El harness e2e deriva la URL de backend/.env (no de process.env) y le
      # sustituye el nombre de la base por cafeteria_test. Se crea ese archivo
      # (gitignored) con la URL del servicio.
      - name: Preparar backend/.env para las pruebas e2e
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "JWT_EXPIRES_IN=$JWT_EXPIRES_IN" >> .env

      - name: Pruebas end-to-end
        run: npm run test:e2e

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Falla si el lockfile apunta a un registry distinto del oficial. Se
      # ejecuta antes de npm ci para no instalar desde un host inesperado.
      - name: Verificar registry del package-lock
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const malas = [];
          const visitar = (valor) => {
            if (!valor || typeof valor !== 'object') return;
            for (const [clave, hijo] of Object.entries(valor)) {
              if (clave === 'resolved' && typeof hijo === 'string') {
                let url;
                try {
                  url = new URL(hijo);
                } catch {
                  continue;
                }
                if (url.hostname !== 'registry.npmjs.org') malas.push(hijo);
              } else {
                visitar(hijo);
              }
            }
          };

          visitar(lock);
          if (malas.length > 0) {
            console.error('URLs resolved fuera de registry.npmjs.org:');
            for (const url of malas) console.error(`  ${url}`);
            process.exit(1);
          }
          console.log('Todas las URLs resolved usan registry.npmjs.org.');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build

      - name: Pruebas
        run: npm test

